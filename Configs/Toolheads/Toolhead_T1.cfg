# Toolhead 1

[mcu nhk1]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/YOUR TOOLBOARD SERIAL HERE              #  T1
restart_method: command

[extruder1]
step_pin: nhk1:gpio23
dir_pin: nhk1:gpio24
enable_pin: !nhk1:gpio25
rotation_distance: 22.85               #22.67895            # Sherpa Mini
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nhk1:gpio9
max_extrude_only_distance: 1400       # Sherpa Mini
max_extrude_only_velocity: 75.0       # Sherpa Mini
max_extrude_only_accel: 1500          # Sherpa Mini
max_extrude_cross_section: 5
sensor_type: Generic 3950
#sensor_type: ATC Semitec 104NT-4-R025H42G
#sensor_type: ATC Semitec 104GT-2                  #Volcano, V6
sensor_pin: nhk1:gpio29
pullup_resistor: 2220
min_temp: 10
max_temp: 300
max_power: 0.7                            #Triangle Lab CHC Pro 115W
min_extrude_temp: 170
pressure_advance: 0.015
pressure_advance_smooth_time: 0.040

control: pid
pid_kp=15.344
pid_ki=0.913
pid_kd=64.447

[tmc2209 extruder1]
uart_pin: nhk1:gpio0
tx_pin: nhk1:gpio1
run_current: 0.5   #0.35             #Sherpa Mini

#[filament_switch_sensor filament_sensor]
#switch_pin: nhk1:gpio3
#pause_on_runout: True

[fan_generic T1_partfan]
pin: nhk1:gpio6
kick_start_time: 0.5
max_power: 1.0
off_below: 0.10

[heater_fan T1_hotend_fan]
pin: nhk1:gpio5
#tachometer_pin: nhk1:gpio16
#tachometer_ppr: 2
max_power: 1.0
kick_start_time: 0.5
heater: extruder1
heater_temp: 40.0
fan_speed: 1.0

[adxl345 T1]
cs_pin: nhk1:gpio27
spi_software_sclk_pin: nhk1:gpio18
spi_software_mosi_pin: nhk1:gpio20
spi_software_miso_pin: nhk1:gpio19
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345 T1
probe_points:
    175, 175, 50
max_smoothing: 0.1
move_speed: 100

[gcode_macro T1]
variable_color: ""
gcode:
  SAVE_GCODE_STATE NAME=move_up
  G91
  G0 Z15 F1500           # Moves the toolhead up so that after the toolchange the nozzle does not end up touching the printed part. DOES NOT WORK WITH ORCA SLICER.
  RESTORE_GCODE_STATE NAME=move_up
  SELECT_TOOL T=1

[tool T1]
tool_number: 1
extruder: extruder1
detection_pin: !nhk1:gpio3   #!nhk1:gpio13
fan: T1_partfan
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
# Position with the toolhead aligned with the dock
params_park_x: 0.0                       #your T1 toolhead park_x here
params_park_y: 0.0                       #your T1 toolhead park_y here
params_park_z: 0.0                       #your T1 toolhead park_x here

params_input_shaper_freq_x: 68.6
params_input_shaper_type_x: 'ei'
params_input_shaper_damping_ratio_x: 0.10
params_input_shaper_freq_y: 73.6
params_input_shaper_type_y: '2hump_ei'
params_input_shaper_damping_ratio_y: 0.10

[tool_probe T1]
##	Klicky Probe
##	This probe is used for Z height and Quad Gantry Leveling
pin: nhk1:gpio10
tool: 1
x_offset: 0.0
y_offset: 20.0       # here comes the Y offset value between the nozzle and the Klicky-Probe microswitch trigger
z_offset: 0.0
speed: 5.2
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3
#activate_gcode:
#    _TAP_PROBE_ACTIVATE HEATER=extruder1

#[neopixel headlight]
#pin: nhk1:gpio7

